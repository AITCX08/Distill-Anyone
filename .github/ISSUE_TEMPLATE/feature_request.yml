name: 功能建议
description: 提出可验证的产品或平台适配需求。
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请勿上传 Cookie、API Key、二维码、媒体原文件或真实任务内容。安全问题请按 SECURITY.md 私下报告。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      placeholder: 说明要解决的问题和受益对象。
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 相关平台或模块
      placeholder: 例如 Dashboard、输出层或某个公开平台
    validations:
      required: true
  - type: textarea
    id: expected_output
    attributes:
      label: 期望输出或验收标准
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案（可选）
